  <path d="M640 288 L640 315" class="arrow" />
  <path d="M640 403 L640 435" class="arrow" />

  <path d="M335 584 L335 605" class="arrow" />
  <path d="M635 584 L635 605" class="arrow" />
  <path d="M935 584 L935 605" class="arrow" />

  <path d="M410 689 L410 725 L640 725 L640 750" class="arrow" />
  <path d="M860 689 L860 725 L640 725 L640 750" class="arrow" />

  <path d="M850 249 L920 249" class="dash" />
  <path d="M770 797 L920 797" class="dash" />
</svg>