<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <style>
      .title { font: 700 26px 'Open Sans', Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 18px 'Open Sans', Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 15px 'Open Sans', Arial, sans-serif; fill: #374151; }
      .start { fill: #dbeaf2; stroke: #6b7280; stroke-width: 2.2; rx: 12; ry: 12; }
      .proc { fill: #faefd9; stroke: #6b7280; stroke-width: 2.2; rx: 12; ry: 12; }
      .group { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.8; rx: 14; ry: 14; }
      .ok { fill: #c8f0c8; stroke: #6b7280; stroke-width: 2.2; rx: 12; ry: 12; }
      .arrow { stroke: #4b5563; stroke-width: 2.6; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#4b5563" />
    </marker>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Kompaktansicht der Migrationspipeline</text>

  <rect x="410" y="70" width="280" height="58" class="start" />
  <text x="550" y="106" text-anchor="middle" class="label">Start: Migration</text>

  <rect x="330" y="165" width="440" height="66" class="proc" />
  <text x="550" y="192" text-anchor="middle" class="label">1. Vorbereitung</text>
  <text x="550" y="214" text-anchor="middle" class="small">Scripts finden, Zielstruktur anlegen</text>

  <rect x="330" y="258" width="440" height="66" class="proc" />
  <text x="550" y="285" text-anchor="middle" class="label">2. Testtranspilation</text>
  <text x="550" y="307" text-anchor="middle" class="small">Groovy-Test Cases in Python-Tests ueberfuehren</text>

  <rect x="110" y="360" width="880" height="190" class="group" />
  <text x="550" y="388" text-anchor="middle" class="label">3. Strukturuebernahme</text>

  <rect x="140" y="418" width="240" height="62" class="proc" />
  <text x="260" y="445" text-anchor="middle" class="label">Object Repository</text>
  <text x="260" y="466" text-anchor="middle" class="small">XML -> JSON</text>

  <rect x="430" y="418" width="240" height="62" class="proc" />
  <text x="550" y="445" text-anchor="middle" class="label">Variablen</text>
  <text x="550" y="466" text-anchor="middle" class="small">testeigene + globale Werte</text>

  <rect x="720" y="418" width="240" height="62" class="proc" />
  <text x="840" y="445" text-anchor="middle" class="label">Runtime + Config</text>
  <text x="840" y="466" text-anchor="middle" class="small">runtime/, pytest.ini, README, requirements</text>

  <rect x="280" y="500" width="540" height="38" class="proc" />
  <text x="550" y="524" text-anchor="middle" class="small">zusaetzlich: externe Testdaten aus .dat-Referenzen nach data/ kopieren</text>

  <rect x="360" y="602" width="380" height="66" class="ok" />
  <text x="550" y="629" text-anchor="middle" class="label">4. Ergebnis</text>
  <text x="550" y="651" text-anchor="middle" class="small">ausfuehrbares Selenium/Pytest-Zielprojekt</text>

  <path d="M550 128 L550 157" class="arrow" />
  <path d="M550 231 L550 250" class="arrow" />
  <path d="M550 324 L550 352" class="arrow" />

  <path d="M260 480 L260 494" class="arrow" />
  <path d="M550 480 L550 494" class="arrow" />
  <path d="M840 480 L840 494" class="arrow" />

  <path d="M550 538 L550 594" class="arrow" />
</svg>